<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>CSV Reporting</title><link id="icon" rel="icon" type="image/svg+xml" href="index.svg"><link rel="stylesheet" href="style.css"></head><body><button id="menuBtn" class="menuBtn">☰</button><div id="overlay" class="overlay" hidden><aside><button id="close">×</button><nav><button data-view="index">index</button><button data-view="map">map</button><button data-view="raw">raw</button><button data-view="edit">edit</button></nav></aside></div><main><h2 id="heading">CSV Reporting System</h2><p id="status"></p><section id="reportView"><h3 id="count">Ergebnisse</h3><button id="filterToggle" class="filterToggle">Filter <span>▼</span></button><div id="filters" class="filterPanel" hidden></div><div class="scroll"><table><thead></thead><tbody></tbody></table></div></section><section id="editView" hidden><header><h1>CSV Rules Editor</h1><div class="actions"><button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="exportBtn">Export</button><button id="saveBtn" class="primary">Speichern</button></div></header><div id="disabled" class="error" hidden>Editor deaktiviert</div><div class="editorShell"><nav class="editorTabs" aria-label="Editorbereiche"><button class="active" data-tab="general">Allgemein</button><button data-tab="columns">Spalten</button><button data-tab="links">Links</button><button data-tab="download">Downloadfilter</button><button data-tab="rules">Regeln</button></nav><div class="editorPanels"><section class="card editorPanel active" data-panel="general"><h2>Allgemein</h2><label class="field">Seitentitel<input id="cfgTitle"></label><label class="field">Überschrift<input id="cfgHeading"></label></section><section class="card editorPanel" data-panel="columns"><h2>Spalten</h2><div id="columns"></div></section><section class="card editorPanel" data-panel="links"><h2>Generische Links</h2><label><input id="linksOn" type="checkbox"> aktiv</label><div id="links"></div></section><section class="card editorPanel" data-panel="download"><h2>Downloadfilter</h2><p class="hint">Werte mit Komma trennen. Passende CSV-Zeilen werden verworfen.</p><div id="download"></div></section><section class="card editorPanel" data-panel="rules"><div class="ruleHead"><h2>Regeln</h2><button id="addRule" class="primary">Regel hinzufügen</button></div><div id="rules"></div></section></div></div></section></main><dialog id="ruleDialog"><form method="dialog"><h3>Regel bearbeiten</h3><label>Info<textarea id="ruleInfo"></textarea></label><div id="conditions"></div><button type="button" id="addCond">+ Bedingung</button><footer><button value="cancel">Abbrechen</button><button value="default" id="applyRule" class="primary">Übernehmen</button></footer></form></dialog><script src="app.js"></script></body></html>
